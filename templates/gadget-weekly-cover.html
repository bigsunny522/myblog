<!doctype html>
<!--
  週刊ガジェットニュースのカバー画像(1200x675 を 2 倍で書き出す)
  毎週変えるのは「号の情報」の3か所だけ: .issue-no / .issue-date / .period / .topics の中身

  書き出し(リポジトリのルートで):
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    PROF="$(mktemp -d)"
    "$CHROME" --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1200,675 --virtual-time-budget=5000 --user-data-dir="$PROF" \
      --screenshot="/tmp/cover.png" "file://$PWD/templates/gadget-weekly-cover.html"
    sips -s format jpeg -s formatOptions 90 /tmp/cover.png --out public/images/posts/<slug>/cover.jpg
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>週刊ガジェットニュース カバー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --fg: #171717;
    --ink: #0B1120;
    --muted: #4A5565;
    --line: #E5E7EB;
    --primary: #7BABFF;
    --primary-strong: #1D4ED8;
    --primary-line: #D6E4FF;
    --primary-tint: #EEF4FF;
    --grid: #7BABFF21;
    --accent: #F59E0B;
    --accent-ink: #1E1B0F;
    --jp: "LINE Seed JP", -apple-system, "Hiragino Sans", sans-serif;
    --en: Outfit, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 675px; overflow: hidden; }
  body {
    font-family: var(--jp);
    color: var(--fg);
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    position: relative;
  }
  .wrap { position: absolute; inset: 64px 72px; display: flex; flex-direction: column; }

  .head { display: flex; align-items: center; gap: 20px; }
  .ribbon {
    display: inline-block;
    transform: skew(-14deg);
    background: var(--primary);
    color: var(--ink);
    font-family: var(--en);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: .3em;
    padding: 9px 18px 9px 24px;
  }
  .ribbon span { display: inline-block; transform: skew(14deg); }
  .issue-no {
    font-family: var(--en);
    font-weight: 800;
    font-size: 18px;
    letter-spacing: .12em;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 7px 14px;
    border-radius: 8px;
  }

  .title {
    margin-top: 34px;
    font-weight: 800;
    font-size: 88px;
    line-height: 1.05;
    letter-spacing: .02em;
    color: var(--ink);
  }
  .title .grad {
    background: linear-gradient(90deg, #7BABFF, #C27AFF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .date-row { margin-top: 22px; display: flex; align-items: baseline; gap: 22px; }
  .issue-date {
    font-family: var(--en);
    font-weight: 800;
    font-size: 56px;
    letter-spacing: .04em;
    color: var(--primary-strong);
  }
  .period {
    font-family: var(--en);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: .16em;
    color: var(--muted);
  }

  .topics { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
  .topic { display: flex; align-items: center; gap: 18px; }
  .chip {
    flex: none;
    width: 132px;
    text-align: center;
    clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
    background: var(--ink);
    color: #fff;
    font-family: var(--en);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .2em;
    padding: 8px 0;
  }
  .topic p { font-weight: 700; font-size: 30px; color: var(--ink); white-space: nowrap; }

  /* 右側の線画(キーボード・マウス・モニター) */
  .art { position: absolute; right: 48px; top: 110px; width: 320px; height: 264px; }
</style>
</head>
<body>
  <svg class="art" viewBox="0 0 400 330" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- monitor (back) -->
    <rect x="120" y="10" width="270" height="165" rx="14" fill="#EEF4FF" stroke="#7BABFF" stroke-width="6"/>
    <rect x="138" y="28" width="234" height="129" rx="6" fill="#FFFFFF" stroke="#D6E4FF" stroke-width="3"/>
    <path d="M160 130 L200 95 L235 115 L280 72 L350 105" stroke="#C27AFF" stroke-width="5" opacity=".7"/>
    <path d="M245 175 L238 210 M275 175 L282 210" stroke="#7BABFF" stroke-width="6"/>
    <path d="M215 212 H305" stroke="#7BABFF" stroke-width="6"/>
    <!-- smartphone (rear, with back display) -->
    <rect x="20" y="70" width="140" height="250" rx="24" fill="#FFFFFF" stroke="#0B1120" stroke-width="5"/>
    <rect x="38" y="88" width="104" height="76" rx="14" fill="#0B1120"/>
    <rect x="84" y="96" width="50" height="60" rx="8" fill="#7BABFF"/>
    <path d="M92 140 L102 128 L110 134 L126 116" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="60" cy="108" r="11" fill="#1E293B" stroke="#D6E4FF" stroke-width="3"/>
    <circle cx="60" cy="144" r="11" fill="#1E293B" stroke="#D6E4FF" stroke-width="3"/>
    <!-- mouse -->
    <path d="M345 250 C 372 250 386 270 386 292 C 386 312 370 324 345 324 C 320 324 304 312 304 292 C 304 270 318 250 345 250 Z" fill="#FFFFFF" stroke="#0B1120" stroke-width="5" transform="translate(-60 -4)"/>
    <path d="M289 250 V 278" stroke="#0B1120" stroke-width="4"/>
    <rect x="285" y="258" width="8" height="14" rx="4" fill="#7BABFF"/>
  </svg>

  <div class="wrap">
    <div class="head">
      <div class="ribbon"><span>WEEKLY GADGET NEWS</span></div>
      <div class="issue-no">#02</div>
    </div>

    <h1 class="title">週刊ガジェット<br><span class="grad">ニュース</span></h1>

    <div class="date-row">
      <div class="issue-date">2026.11.21</div>
      <div class="period">11.15 — 11.21</div>
    </div>

    <div class="topics">
      <div class="topic"><div class="chip">PHONE</div><p>背面ディスプレイの Xiaomi 18 Pro が11月27日発売</p></div>
      <div class="topic"><div class="chip">PHONE</div><p>AQUOS sense11 が94,600円から、11月26日発売</p></div>
      <div class="topic"><div class="chip">DESK</div><p>光るディスプレイボードに静音マウス、ルーム補正スピーカー</p></div>
    </div>
  </div>
</body>
</html>
